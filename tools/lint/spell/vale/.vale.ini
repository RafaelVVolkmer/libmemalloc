StylesPath = styles
MinAlertLevel = suggestion
Vocab = Libmemalloc

[formats]
mdx = md

[*.{md,markdown,mdx,rst,adoc}]
BasedOnStyles = Libmemalloc
TokenIgnores = (\b(?:rc|S3|Silo)\b)
Libmemalloc.Anthropomorphism = warning
Libmemalloc.PassiveVoice = suggestion
Libmemalloc.PercentSpacing = NO
Libmemalloc.SecondPerson = NO

[docs/standards/c/**]
BasedOnStyles = LibmemallocSpelling
TokenIgnores = (\b(?:archiver|pragma|pragmas|toolchain|toolchains|typedef|vendored)\b)
Libmemalloc = NO
Libmemalloc.Anthropomorphism = NO
Libmemalloc.PassiveVoice = NO
Libmemalloc.PercentSpacing = NO
Libmemalloc.SecondPerson = NO

# Research severity belongs to distinct rules; Vale severity overrides are global.
[*.paper.{md,markdown,mdx,rst,adoc}]
BasedOnStyles = Libmemalloc, LibmemallocResearch
Libmemalloc.Anthropomorphism = NO
Libmemalloc.PassiveVoice = NO
Libmemalloc.PercentSpacing = NO
Libmemalloc.ReaderAddress = NO
Libmemalloc.SecondPerson = warning

[docs/articles/**]
BasedOnStyles = Libmemalloc, LibmemallocResearch
Libmemalloc.Anthropomorphism = NO
Libmemalloc.PassiveVoice = NO
Libmemalloc.PercentSpacing = NO
Libmemalloc.ReaderAddress = NO
Libmemalloc.SecondPerson = warning

[docs/papers/**]
BasedOnStyles = Libmemalloc, LibmemallocResearch
Libmemalloc.Anthropomorphism = NO
Libmemalloc.PassiveVoice = NO
Libmemalloc.PercentSpacing = NO
Libmemalloc.ReaderAddress = NO
Libmemalloc.SecondPerson = warning

[docs/research/**]
BasedOnStyles = Libmemalloc, LibmemallocResearch
Libmemalloc.Anthropomorphism = NO
Libmemalloc.PassiveVoice = NO
Libmemalloc.PercentSpacing = NO
Libmemalloc.ReaderAddress = NO
Libmemalloc.SecondPerson = warning

# C comment content is validated by Doxygen, not prose rules.
[*.{c,h,i,cpp,hpp}]
BasedOnStyles =
Libmemalloc = NO

# EOF

