---
extends: capitalization

message: "Use sentence case for the heading '%s'."

level: suggestion

scope: heading

match: $sentence

indicators:
  - ':'

exceptions:
  - API
  - C
  - 'C\+\+'
  - Libmemalloc
  - GitHub
  - JSON
  - JSONC
  - Linux
  - POSIX
  - README

# EOF

