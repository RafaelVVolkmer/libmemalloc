---
extends: existence

message: "Replace the negative list '%s' with one positive description."

level: warning

ignorecase: true

nonword: true

raw:
  - '\b(?:no|not)\s+[^,.;]{1,40},\s*(?:no|not)\s+[^,.;]{1,40},\s*(?:and\s+|or\s+)?(?:no|not)\b'

# EOF

