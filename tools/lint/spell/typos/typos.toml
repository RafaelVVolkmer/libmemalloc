[files]
extend-exclude = [
  ".git/**",
  ".cache/**",
  "doxygen/vendor/**",
  "LICENSES/**",
  "**/*.svg",
  "**/*.aff",
  "**/*.dic",
  "**/*.lock",
  "**/*.min.*",
  "**/*.patch",
]

[default]
# Doxygen owns C comment content, including C comments in Markdown fences.
extend-ignore-re = [ "(?s)/\\*.*?\\*/", "//[^\\n]*" ]
locale = "en-us"
check-filename = true
check-file = true
unicode = true

