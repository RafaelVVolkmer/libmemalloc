---
- name: "Plan formal stage {{ lma_formal_stage }}"
  ansible.builtin.command:
    argv:
      - "{{ lma_lua_executable }}"
      - scripts/process/playbook.lua
      - plan
      - "formal-{{ lma_formal_stage }}"
      - "--run-id={{ lma_run_id }}"
    chdir: "{{ lma_workspace }}"
    expand_argument_vars: false
  environment:
    LUA_CPATH: "{{ lma_managed_luv }};;"
  changed_when: false
  check_mode: false

- name: "Run and assess formal stage {{ lma_formal_stage }}"
  when: not ansible_check_mode
  environment:
    LIBMEMALLOC_LUA: "{{ lma_lua_executable }}"
    LUA_CPATH: "{{ lma_managed_luv }};;"
  block:
    - name: "Execute formal-{{ lma_formal_stage }}"
      ansible.builtin.command:
        argv:
          - "{{ lma_lua_executable }}"
          - scripts/process/playbook.lua
          - --result-json
          - "formal-{{ lma_formal_stage }}"
          - "--run-id={{ lma_run_id }}"
        chdir: "{{ lma_workspace }}"
        expand_argument_vars: false
      register: task_execution
      changed_when: false

  always:
    - name: Show formal stage result even after failure
      ansible.builtin.include_tasks: result.yml

    - name: Show the formal proof evidence and retained log locations
      ansible.builtin.include_tasks: formal-evidence.yml

# EOF

