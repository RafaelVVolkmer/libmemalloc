---
name: OpenSSF integration qualification

on:
  schedule:
    - cron: "27 8 * * 2"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: openssf-qualification
  cancel-in-progress: false

jobs:
  plan:
    name: Plan catalog coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/workspace-cache

      - uses: ./.github/actions/setup-release

      - name: Expand all declared integrations
        id: plan
        run: |
          lua scripts/process/playbook.lua --direct test-security-openssf-test
          lua scripts/process/playbook.lua --direct security-plan

  fixture:
    name: Prepare assessment artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/_release-checks.yml

  project:
    name: Qualify ${{ matrix.project }}
    needs: [fixture, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.project == 'cve-binary-tool' && 60 || 40 }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure repository-local caches
        uses: ./.github/actions/workspace-cache

      - name: Setup release tools
        id: tools
        uses: ./.github/actions/setup-release

      - name: Download candidate from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: .cache/build/openssf

      - name: Restore verified Cosign
        if: matrix.project == 'sigstore'
        id: cosign
        uses: ./.github/actions/verified-download
        with:
          name: cosign
          version: ${{ fromJSON(steps.tools.outputs.tools).cosign.version }}
          filename: cosign-linux-amd64
          sha256: ${{ fromJSON(steps.tools.outputs.tools).cosign.sha256 }}
          origin: https://github.com
          directory: sigstore/cosign/releases/download/v${{ fromJSON(steps.tools.outputs.tools).cosign.version }}

      - name: Install verified Cosign
        if: matrix.project == 'sigstore'
        env:
          COSIGN_BINARY: ${{ steps.cosign.outputs.path }}
        run: install -m 0755 "${COSIGN_BINARY}" "${LIBMEMALLOC_CACHE_ROOT}/tools/libmemalloc-lua-bin/cosign"

      - name: Restore verified Scorecard
        if: matrix.project == 'scorecard'
        id: scorecard
        uses: ./.github/actions/verified-download
        with:
          name: scorecard
          version: ${{ fromJSON(steps.tools.outputs.tools).scorecard.version }}
          filename: scorecard_${{ fromJSON(steps.tools.outputs.tools).scorecard.version }}_linux_amd64.tar.gz
          sha256: ${{ fromJSON(steps.tools.outputs.tools).scorecard.sha256 }}
          origin: https://github.com
          directory: ossf/scorecard/releases/download/v${{ fromJSON(steps.tools.outputs.tools).scorecard.version }}

      - name: Install verified Scorecard
        if: matrix.project == 'scorecard'
        env:
          SCORECARD_ARCHIVE: ${{ steps.scorecard.outputs.path }}
        run: |
          install -d "${LIBMEMALLOC_CACHE_ROOT}/tools/openssf/bin"
          tar -xzf "${SCORECARD_ARCHIVE}" -C "${LIBMEMALLOC_CACHE_ROOT}/tools/openssf/bin" scorecard

      - name: Fetch main and signed source policy
        if: matrix.project == 'gittuf'
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            git fetch --unshallow --no-tags origin
          fi
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/gittuf/*:refs/gittuf/*'
          git update-ref refs/heads/main refs/remotes/origin/main

      - name: Restore verified gittuf
        if: matrix.project == 'gittuf'
        id: gittuf
        uses: ./.github/actions/verified-download
        with:
          name: gittuf
          version: ${{ fromJSON(steps.tools.outputs.tools).gittuf.version }}
          filename: gittuf_${{ fromJSON(steps.tools.outputs.tools).gittuf.version }}_linux_amd64
          sha256: ${{ fromJSON(steps.tools.outputs.tools).gittuf.sha256 }}
          origin: https://github.com
          directory: gittuf/gittuf/releases/download/v${{ fromJSON(steps.tools.outputs.tools).gittuf.version }}

      - name: Install verified gittuf
        if: matrix.project == 'gittuf'
        env:
          GITTUF_BINARY: ${{ steps.gittuf.outputs.path }}
        run: |
          install -d "${LIBMEMALLOC_CACHE_ROOT}/tools/openssf/bin"
          install -m 0755 "${GITTUF_BINARY}" "${LIBMEMALLOC_CACHE_ROOT}/tools/openssf/bin/gittuf"

      - name: Restore historical source policy objects
        if: matrix.project == 'gittuf'
        uses: ./.github/actions/gittuf-objects
        with:
          reference: refs/heads/main

      - name: Execute integration or report missing prerequisites
        env:
          PROJECT: ${{ matrix.project }}
          BEST_PRACTICES_PROJECT_ID: ${{ vars.BEST_PRACTICES_PROJECT_ID }}
          RELEASE_ROOT: ${{ needs.fixture.outputs.root }}
          GITHUB_AUTH_TOKEN: >-
            ${{ contains(fromJSON('["criticality-score", "scorecard"]'), matrix.project) && github.token || '' }}
          GITHUB_TOKEN: >-
            ${{ contains(fromJSON('["criticality-score", "scorecard"]'), matrix.project) && github.token || '' }}
        run: |
          lua scripts/process/playbook.lua --direct workspace-cache lua scripts/process/playbook.lua --direct \
          security-run \
            --project="${PROJECT}" --install \
            --root=".cache/build/openssf/${RELEASE_ROOT#release/}"

      - name: Preserve assessment, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openssf-${{ matrix.project }}
          path: .cache/logs/openssf/${{ matrix.project }}/
          include-hidden-files: true
          if-no-files-found: error

  report:
    name: Reconcile complete OpenSSF coverage
    if: always()
    needs: [plan, fixture, project]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/workspace-cache

      - uses: ./.github/actions/setup-release

      - name: Collect all available assessments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: openssf-*
          path: .cache/ci/openssf-input

      - name: Require every declared integration
        if: always()
        run: |
          lua scripts/process/playbook.lua --direct security-report --input=.cache/ci/openssf-input \
            --output=.cache/ci/openssf-summary

      - name: Preserve complete coverage and blockers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openssf-coverage
          path: .cache/ci/openssf-summary/
          include-hidden-files: true
          if-no-files-found: error

# EOF

