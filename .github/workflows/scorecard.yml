---
name: OpenSSF Scorecard

on:
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  assessment:
    name: Assess repository practices
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write # Upload the assessment to GitHub code scanning.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure repository-local caches
        uses: ./.github/actions/workspace-cache

      - name: Assess repository practices without external publication
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: .cache/logs/scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: false

      - name: Upload repository assessment to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: .cache/logs/scorecard.sarif
          category: openssf-scorecard

      - name: Preserve assessment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openssf-scorecard
          path: .cache/logs/scorecard.sarif
          include-hidden-files: true
          if-no-files-found: error

# EOF

