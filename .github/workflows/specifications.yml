---
name: Specification labels

on:
  issues:
    types: [opened, labeled, unlabeled, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to reconcile; leave empty to synchronize the catalog.
        type: string
        required: false

permissions: {}

concurrency:
  group: specification-labels-${{ github.event.issue.number || inputs.issue || 'catalog' }}
  cancel-in-progress: false

jobs:
  labels:
    name: Enforce maintainer decisions
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # Reconcile specification labels using trusted policy.
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure repository-local caches
        uses: ./.github/actions/workspace-cache

      - name: Setup pinned Lua
        id: lua
        uses: ./.github/actions/setup-lua

      - name: Reconcile metadata from authorized history
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          LUA: ${{ steps.lua.outputs.lua }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${ISSUE_NUMBER}" ]]; then
            "${LUA}" scripts/process/playbook.lua --direct spec-reconcile \
              "--issue=${ISSUE_NUMBER}"
          else
            "${LUA}" scripts/process/playbook.lua --direct spec-labels
          fi

# EOF

