---
name: Setup release checks
description: Expose the pinned Lua runtime and resolve release tool identities.

outputs:
  tools:
    description: Locked tool metadata.
    value: ${{ steps.toolchain.outputs.tools }}

runs:
  using: composite

  steps:
    - name: Setup pinned Lua
      id: lua
      uses: ./.github/actions/setup-lua

    - name: Expose Lua
      shell: bash
      # Fixed runner-local directory populated by the checksum-verified Lua build.
      run: | # zizmor: ignore[github-env]
        printf '%s\n' "${LIBMEMALLOC_CACHE_ROOT}/tools/libmemalloc-lua-bin" >> "${GITHUB_PATH}"

    - name: Resolve tool identities
      id: toolchain
      uses: ./.github/actions/toolchain

# EOF

